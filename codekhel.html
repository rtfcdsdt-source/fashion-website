@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--border:#30363d;--code:#0d1117;--on-accent:#0b1220;--hc:#7ee787;--hs:#ffa657;--hk:#d2a8ff;--hn:#79c0ff;--ht:#ff7b9c;--ha:#79c0ff;--err:#ff7b72}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--border:#30363d;--code:#0d1117;--on-accent:#0b1220;--hc:#7ee787;--hs:#ffa657;--hk:#d2a8ff;--hn:#79c0ff;--ht:#ff7b9c;--ha:#79c0ff;--err:#ff7b72}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--border)}
.logo{font-weight:800;margin-right:auto}.logo span{color:var(--accent)}
button,select,input.nm{font:inherit;font-size:.85rem;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}
input.nm{cursor:text;width:120px}
button.run{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.work{flex:1;display:flex;flex-direction:column;min-height:0}
@media (min-width:800px){.work{flex-direction:row}}
.pane{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.pane+.pane{border-top:1px solid var(--border)}
@media (min-width:800px){.pane+.pane{border-top:0;border-left:1px solid var(--border)}}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border)}
.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent;padding:8px 16px;color:var(--muted)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.ed{position:relative;flex:1;min-height:0;background:var(--code);overflow:hidden}
.gut{position:absolute;left:0;top:0;bottom:0;width:40px;background:var(--card);border-right:1px solid var(--border);overflow:hidden;color:var(--muted);text-align:right;font:13px/20px ui-monospace,Menlo,Consolas,monospace}
#gin{padding:12px 6px 0 0;white-space:pre}
#hl,#ed{position:absolute;left:40px;right:0;top:0;bottom:0;margin:0;padding:12px;font:13px/20px ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2;border:0;letter-spacing:0}
#hl{overflow:hidden;pointer-events:none;color:var(--text)}
#ed{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--text);resize:none;overflow:auto;outline:none;width:calc(100% - 40px)}
.hc{color:var(--hc)}.hs{color:var(--hs)}.hk{color:var(--hk)}.hn{color:var(--hn)}.ht{color:var(--ht)}.ha{color:var(--ha)}
.lbl{padding:5px 10px;font-size:.78rem;color:var(--muted);background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.lbl button{padding:2px 8px;font-size:.75rem}
iframe{flex:1;width:100%;border:0;background:#fff;min-height:0}
#con{height:96px;overflow:auto;background:var(--code);border-top:1px solid var(--border);padding:6px 10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-wrap:break-word}
#con .error{color:var(--err)}#con .warn{color:var(--hs)}
</style>
