<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mera AI</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f1d1a;--muted:#6b665e;--accent:#d9622b;--border:#e6e0d6;--me:#f3e6dc;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#171513;--card:#211e1b;--text:#f1ede6;--muted:#a39d92;--accent:#f0804a;--border:#38332d;--me:#3a2d25;--on-accent:#1a120c}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--text:#f1ede6;--muted:#a39d92;--accent:#f0804a;--border:#38332d;--me:#3a2d25;--on-accent:#1a120c}
:root[data-theme="blue"]{--bg:#e9f0fa;--card:#fff;--text:#16233a;--muted:#5b6c86;--accent:#2563eb;--border:#d3deee;--me:#d7e5f8;--on-accent:#fff}
html[data-font="small"]{font-size:14px}
html[data-font="large"]{font-size:18px}
html[data-hindi="1"] body{font-family:"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;display:flex;flex-direction:column}
header{padding:8px 8px;border-bottom:1px solid var(--border);font-weight:700;font-size:.95rem;background:var(--card);display:flex;align-items:center;gap:6px}
header .t{flex:1}
.hbtn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:5px 8px;font-size:.85rem;font-weight:600;cursor:pointer}
#who{font-size:.8rem;color:var(--muted);text-align:center;padding:5px 8px 0;background:var(--card)}
#modes{display:flex;gap:6px;overflow-x:auto;padding:8px 8px;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.panel{display:none;max-width:720px;width:100%;margin:0 auto;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--border)}
.panel h3{margin:0 0 8px;font-size:1rem}
.panel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.panel .lbl{font-size:.85rem;color:var(--muted);min-width:74px}
#rmbar{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin:8px 0}
#rmfill{height:100%;background:var(--accent);width:0%;transition:width .2s}
.rmph{font-weight:700;margin-top:12px;font-size:.9rem}
.rmstep{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border);font-size:.92rem}
.rmstep input{margin-top:3px;flex:0 0 auto}
.rmstep.done span{text-decoration:line-through;color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:12px 8px;max-width:720px;width:100%;margin:0 auto}
.m{padding:10px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word;max-width:94%}
.u{background:var(--me);margin-left:auto}
.a{background:var(--card);border:1px solid var(--border)}
.copy{display:block;margin-top:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:8px;padding:3px 10px;font-size:.78rem;font-weight:600;cursor:pointer}
.editrow{display:flex;gap:6px;margin-top:8px}
.editrow input{flex:1;font:inherit;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
.editrow button{font:inherit;border:0;border-radius:10px;padding:0 14px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
form{display:flex;gap:6px;padding:10px 8px;border-top:1px solid var(--border);background:var(--card);max-width:720px;width:100%;margin:0 auto}
form button{padding:0 14px}
textarea{flex:1;font:inherit;padding:12px 14px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text);resize:none;height:56px}
button{font:inherit;border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#cam{background:var(--card);color:var(--text);border:1px solid var(--border)}
#pv{display:none;max-width:720px;width:100%;margin:0 auto;padding:10px 8px 0;align-items:center;gap:10px}
#pv img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#fff}
#pv span{color:var(--muted);font-size:.85rem;flex:1}
#pvx{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:50%;width:28px;height:28px;padding:0;font-size:14px;line-height:1}
#styles{display:none;max-width:720px;width:100%;margin:0 auto;padding:8px 8px 0;gap:6px;flex-wrap:wrap;align-items:center}
#styles .lbl{font-size:.85rem;color:var(--muted)}
#hint{color:var(--muted);text-align:center;margin-top:24px;font-size:.9rem}
</style>
</head>
<body>
<header><span class="t">✨ Mera AI</span><button type="button" class="hbtn" id="rmBtn" title="Coding roadmap">📋 Roadmap</button><button type="button" class="hbtn" id="clrBtn" title="Nayi baat-cheet">🗑️</button><button type="button" class="hbtn" id="setBtn" title="Settings">⚙️</button></header>
<div id="who"></div>
<div id="modes"><button type="button" class="chip on" data-mode="aam">💬 Aam</button><button type="button" class="chip" data-mode="padhai">📚 Padhai</button><button type="button" class="chip" data-mode="coding">💻 Coding</button><button type="button" class="chip" data-mode="translator">🌐 Translator</button><button type="button" class="chip" data-mode="kahani">📖 Kahani</button><button type="button" class="chip" data-mode="quiz">❓ Quiz</button><button type="button" class="chip" data-mode="summary">📝 Summary</button></div>
<div id="settings" class="panel"><h3>⚙️ Settings</h3>
<div class="row"><span class="lbl">Rang</span><button type="button" class="chip" data-t="auto">🌞 Auto</button><button type="button" class="chip" data-t="light">Halka</button><button type="button" class="chip" data-t="dark">Andhera</button><button type="button" class="chip" data-t="blue">Neela</button></div>
<div class="row"><span class="lbl">Akshar</span><button type="button" class="chip" data-f="small">Chhota</button><button type="button" class="chip" data-f="normal">Aam</button><button type="button" class="chip" data-f="large">Bada</button></div>
<div class="row"><span class="lbl">Hindi font</span><button type="button" class="chip" id="hindiBtn">Hindi saaf font: Band</button></div>
</div>
<div id="roadmap" class="panel"><h3>📋 Coding Roadmap — YouTube jaisa app (MVP)</h3>
<div style="font-size:.85rem;color:var(--muted)">Ye steps aapke saved plan se hain. Tick lagao, progress dekho.</div>
<div id="rmbar"><div id="rmfill"></div></div><div id="rmcount">0 / 11 poora</div>
<div id="rmlist"></div>
<div class="row"><button type="button" class="chip" id="rmReset">↺ Reset</button></div>
</div>
<div id="log"><div id="hint">Namaste! Apna sawal neeche likho.</div></div>
<input type="file" id="fp" accept="image/*" hidden>
<div id="pv"><img id="pvi" alt="photo"><span>Photo jod di gayi hai</span><button type="button" id="pvx" title="Photo hatao">✕</button></div>
<div id="styles"><span class="lbl">Tasveer ka style:</span><button type="button" class="chip on" data-style="simple">🎨 Simple</button><button type="button" class="chip" data-style="cartoon">🎭 Cartoon</button><button type="button" class="chip" data-style="naksha">🗺️ Naksha</button><button type="button" class="chip" data-style="logo">🔰 Logo</button></div>
<form id="f"><textarea id="q" placeholder="Yahan likho..."></textarea><button type="button" id="cam" title="Photo jodo">📷</button><button id="b">Bhejo</button><button type="button" id="ib" title="Tasveer banao" style="background:var(--card);color:var(--text);border:1px solid var(--border)">🎨</button></form>
<script>
// ---- Profile (fashion site ki Google login se) ----
function prof(){try{var p=JSON.parse(localStorage.getItem("fgProfile")||"null");if(p&&p.id)return{name:p.name||"",email:String(p.id)}}catch(e){}return{name:"",email:""}}
function suffix(){var e=prof().email;return e?("-"+e.replace(/[^A-Za-z0-9_@.-]/g,"_")):""}
// ---- Settings (theme / font / hindi / mode / style) ----
var DEF_SET={theme:"auto",font:"normal",hindi:0,mode:"aam",style:"simple"};
var settings=DEF_SET;
try{var s0=JSON.parse(localStorage.getItem("meraai-settings-v1")||"null");if(s0)for(var k in DEF_SET)if(s0[k]!==undefined)settings[k]=s0[k]}catch(e){}
function saveSettings(){try{localStorage.setItem("meraai-settings-v1",JSON.stringify(settings))}catch(e){}}
function applySettings(){
 var r=document.documentElement;
 if(settings.theme&&settings.theme!=="auto")r.setAttribute("data-theme",settings.theme);else r.removeAttribute("data-theme");
 if(settings.font&&settings.font!=="normal")r.setAttribute("data-font",settings.font);else r.removeAttribute("data-font");
 if(settings.hindi)r.setAttribute("data-hindi","1");else r.removeAttribute("data-hindi");
 Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(c){c.classList.toggle("on",c.getAttribute("data-t")===settings.theme)});
 Array.prototype.forEach.call(document.querySelectorAll("[data-f]"),function(c){c.classList.toggle("on",c.getAttribute("data-f")===settings.font)});
 var hb=document.getElementById("hindiBtn");if(hb)hb.textContent="Hindi saaf font: "+(settings.hindi?"Chalu":"Band");
 Array.prototype.forEach.call(document.querySelectorAll("#modes .chip"),function(c){c.classList.toggle("on",c.getAttribute("data-mode")===settings.mode)});
 Array.prototype.forEach.call(document.querySelectorAll("#styles .chip"),function(c){c.classList.toggle("on",c.getAttribute("data-style")===settings.style)});
}
// ---- Chat save (localStorage, sirf is phone par) ----
var HIST_KEY="meraai-history-v1"+suffix();
var log=document.getElementById("log"),q=document.getElementById("q"),b=document.getElementById("b"),hist=[];
function saveHist(){try{localStorage.setItem(HIST_KEY,JSON.stringify(hist.slice(-12)))}catch(e){}}
function loadHist(){try{var h=JSON.parse(localStorage.getItem(HIST_KEY)||"null");if(Array.isArray(h))return h.filter(function(m){return m&&typeof m.text==="string"})}catch(e){}return[]}
function showHint(){if(!log.querySelector("#hint")){var h=document.createElement("div");h.id="hint";h.textContent="Namaste! Apna sawal neeche likho.";log.appendChild(h)}}
function add(cls,txt){var d=document.createElement("div");d.className="m "+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
// ---- Copy button ----
function copyText(t){
 if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(function(){return true},function(){return legacyCopy(t)});
 return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){try{var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}catch(e){return false}}
function attachCopy(box,getText){
 var c=document.createElement("button");c.type="button";c.className="copy";c.textContent="📋 Copy";
 c.onclick=function(e){if(e)e.stopPropagation();var t="";try{t=getText()||""}catch(err){t=""}copyText(t).then(function(ok){c.textContent=ok?"✓ Copy ho gaya":"Copy nahi hua";setTimeout(function(){c.textContent="📋 Copy"},1500)})};
 box.appendChild(c);
}
// ---- Roadmap (aapke saved YouTube-jaisa app MVP plan se) ----
var RM_STEPS=[
 {ph:"Plan — Features (MVP)",steps:["User sign up / login","Video upload karna","Videos ki list aur video play karna","Search","Like, comment, subscribe"]},
 {ph:"Kya use hota hai — Tech",steps:["Frontend: React ya Flutter (mobile ke liye)","Backend: Node.js ya Python (Django/FastAPI)","Database: PostgreSQL ya MongoDB","Video storage aur streaming: AWS S3, Cloudflare Stream, ya Firebase Storage"]},
 {ph:"Meri madad — Seekhna aur code",steps:["Plan aur features ki list banana","Code likhna step by step"]}
];
var RM_KEY="meraai-roadmap-v1"+suffix();
var rmDone={};
try{var r0=JSON.parse(localStorage.getItem(RM_KEY)||"null");if(r0)rmDone=r0}catch(e){}
function saveRm(){try{localStorage.setItem(RM_KEY,JSON.stringify(rmDone))}catch(e){}}
function rmTotal(){var n=0;RM_STEPS.forEach(function(g){n+=g.steps.length});return n}
function renderRm(){
 var list=document.getElementById("rmlist");list.innerHTML="";var idx=0,done=0,total=rmTotal();
 RM_STEPS.forEach(function(g){
  var ph=document.createElement("div");ph.className="rmph";ph.textContent=g.ph;list.appendChild(ph);
  g.steps.forEach(function(st){
   var id="rm"+idx;idx++;
   var row=document.createElement("label");row.className="rmstep"+(rmDone[id]?" done":"");
   var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!rmDone[id];
   cb.onchange=function(){if(cb.checked)rmDone[id]=1;else delete rmDone[id];saveRm();renderRm()};
   var sp=document.createElement("span");sp.textContent=st;
   row.appendChild(cb);row.appendChild(sp);list.appendChild(row);
   if(rmDone[id])done++;
  });
 });
 document.getElementById("rmcount").textContent=done+" / "+total+" poora";
 document.getElementById("rmfill").style.width=(total?Math.round(done/total*100):0)+"%";
}
document.getElementById("rmReset").onclick=function(){rmDone={};saveRm();renderRm()};
// ---- Photo jodna ----
// Photo ko pehle yahin chhota karte hain (max side 1024px, JPEG 0.8) taaki upload
// ~100-300KB rahe. Photo sirf usi message ke saath jaati hai, history mein nahi.
var cam=document.getElementById("cam"),fp=document.getElementById("fp"),pv=document.getElementById("pv"),pvi=document.getElementById("pvi"),pvx=document.getElementById("pvx");
var photo=null,photoUrl=""; // {mime,data} — base64, "data:..." prefix nahi
function clearPhoto(){photo=null;photoUrl="";pv.style.display="none";pvi.removeAttribute("src");fp.value=""}
cam.onclick=function(){fp.click()};
pvx.onclick=clearPhoto;
fp.onchange=function(){
 var f=fp.files&&fp.files[0];if(!f)return;
 if(!/^image\//.test(f.type||"")){alert("Sirf photo (JPG, PNG, WebP ya GIF) chun sakte ho.");fp.value="";return}
 var url=URL.createObjectURL(f);var im=new Image();
 im.onload=function(){
  var s=Math.min(1,1024/Math.max(im.naturalWidth||1,im.naturalHeight||1));
  var cw=Math.max(1,Math.round((im.naturalWidth||1)*s)),ch=Math.max(1,Math.round((im.naturalHeight||1)*s));
  var c=document.createElement("canvas");c.width=cw;c.height=ch;
  c.getContext("2d").drawImage(im,0,0,cw,ch);
  URL.revokeObjectURL(url);
  var d=c.toDataURL("image/jpeg",0.8);
  photo={mime:"image/jpeg",data:d.split(",")[1]};photoUrl=d;
  pvi.src=d;pv.style.display="flex";q.focus();
 };
 im.onerror=function(){URL.revokeObjectURL(url);alert("Photo khul nahi payi. Doosri photo try karo.");fp.value=""};
 im.src=url;
};
async function send(){
 var t=q.value.trim();
 if(!t&&!photo)return;
 if(!t)t="Is photo ke baare mein batao.";
 var h=document.getElementById("hint");if(h)h.remove();
 q.value="";var ub=add("u",t);
 if(photoUrl){var pim=document.createElement("img");pim.alt="photo";pim.style.cssText="width:100%;max-width:220px;border-radius:10px;display:block;margin-top:8px";pim.src=photoUrl;ub.appendChild(pim);log.scrollTop=log.scrollHeight}
 hist.push({role:"user",text:t});
 var imgToSend=photo;clearPhoto();
 var box=add("a","Soch raha hun...");b.disabled=true;cam.disabled=true;ib.disabled=true;q.disabled=true;
 try{
  var payload={mode:settings.mode,messages:hist.slice(-12)};
  if(imgToSend)payload.image={mimeType:imgToSend.mime,data:imgToSend.data};
  var r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  var d={};try{d=await r.json()}catch(e){}
  if(!r.ok){box.textContent=d.error||("Kuch gadbad hui (code "+r.status+"). Thodi der baad dobara try karo.");b.disabled=false;cam.disabled=false;ib.disabled=false;q.disabled=false;q.focus();return}
  var ans=(d.reply||"").trim();
  if(!ans){box.textContent="Khali jawab aaya. Dobara try karo.";b.disabled=false;cam.disabled=false;ib.disabled=false;q.disabled=false;q.focus();return}
  box.textContent=ans;attachCopy(box,function(){return ans});hist.push({role:"assistant",text:ans});saveHist();
 }catch(e){box.textContent="Internet ya server se jod nahi paya. Dobara try karo."}
 b.disabled=false;cam.disabled=false;ib.disabled=false;q.disabled=false;q.focus();
}
// ---- Tasveer banana (🎨 SVG illustration; asli photo nahi banti) ----
var STYLES={simple:{label:"Simple",pre:""},cartoon:{label:"Cartoon",pre:"Cartoon style mein, rang-biranga: "},naksha:{label:"Naksha",pre:"Saaf diagram/naksha style mein, labels ke saath: "},logo:{label:"Logo",pre:"Simple logo style mein, saaf background par: "}};
var ib=document.getElementById("ib");
function attachEdit(box,origT){
 var wrap=document.createElement("div");wrap.className="editrow";
 var inp=document.createElement("input");inp.type="text";inp.placeholder="Kya badalna hai? (jaise: rang neela kar do)";
 var go=document.createElement("button");go.type="button";go.textContent="Bhejo";
 go.onclick=function(){var e=inp.value.trim();if(!e)return;inp.value="";draw("Pehli wali tasveer jaisi hi banao, lekin "+e,"✏️ "+e)};
 wrap.appendChild(inp);wrap.appendChild(go);box.appendChild(wrap);
}
async function draw(tOverride,labelOverride){
 document.getElementById("styles").style.display="flex";
 var t=(tOverride!==undefined)?tOverride:q.value.trim();
 if(!t){alert("Pehle likho ki kaisi tasveer chahiye.");return}
 var h=document.getElementById("hint");if(h)h.remove();
 if(tOverride===undefined)q.value="";
 var st=STYLES[settings.style]||STYLES.simple;
 var prompt=st.pre+t;
 var label=labelOverride||("🎨 "+(settings.style!=="simple"?"["+st.label+"] ":"")+t);
 add("u",label);
 var box=add("a","Tasveer bana raha hun...");b.disabled=true;ib.disabled=true;q.disabled=true;
 try{
  var r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"image",messages:[{role:"user",text:prompt}]})});
  var d={};try{d=await r.json()}catch(e){}
  if(!r.ok){box.textContent=d.error||("Kuch gadbad hui (code "+r.status+"). Thodi der baad dobara try karo.");}
  else{
   var txt=(d.reply||"");
   var m=txt.match(/<svg[\s\S]*<\/svg>/i);
   if(!m){box.textContent="Tasveer nahi ban payi. Thoda alag likhkar dobara try karo.";}
   else{
    box.textContent="";var im=document.createElement("img");im.alt=t;im.style.cssText="width:100%;max-width:420px;border-radius:10px;background:#fff;display:block";im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(m[0]);box.appendChild(im);
    var svg=m[0];box._svg=svg;
    attachCopy(box,function(){return box._svg||""});
    attachEdit(box,t);
    log.scrollTop=log.scrollHeight;
   }
  }
 }catch(e){box.textContent="Internet ya server se jod nahi paya. Dobara try karo."}
 b.disabled=false;ib.disabled=false;q.disabled=false;q.focus();
}
ib.onclick=function(){draw()};
// ---- Modes / Settings / Roadmap / Clear ----
Array.prototype.forEach.call(document.querySelectorAll("#modes .chip"),function(c){
 c.onclick=function(){settings.mode=c.getAttribute("data-mode");saveSettings();applySettings()};
});
Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(c){
 c.onclick=function(){settings.theme=c.getAttribute("data-t");saveSettings();applySettings()};
});
Array.prototype.forEach.call(document.querySelectorAll("[data-f]"),function(c){
 c.onclick=function(){settings.font=c.getAttribute("data-f");saveSettings();applySettings()};
});
document.getElementById("hindiBtn").onclick=function(){settings.hindi=settings.hindi?0:1;saveSettings();applySettings()};
Array.prototype.forEach.call(document.querySelectorAll("#styles .chip"),function(c){
 c.onclick=function(){settings.style=c.getAttribute("data-style");saveSettings();applySettings()};
});
document.getElementById("setBtn").onclick=function(){var p=document.getElementById("settings");p.style.display=p.style.display==="block"?"none":"block"};
document.getElementById("rmBtn").onclick=function(){var p=document.getElementById("roadmap");p.style.display=p.style.display==="block"?"none":"block"};
document.getElementById("clrBtn").onclick=function(){
 hist=[];try{localStorage.removeItem(HIST_KEY)}catch(e){}
 log.innerHTML="";showHint();
};
document.getElementById("f").onsubmit=function(e){e.preventDefault();send()};
q.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
// ---- Load: who line + settings + purani baat-cheet + roadmap ----
(function(){
 var p=prof();
 document.getElementById("who").textContent=p.name?("Logged in as "+p.name):"Guest — chat sirf is phone par bachegi";
 applySettings();renderRm();
 hist=loadHist();
 if(hist.length){
  var h=document.getElementById("hint");if(h)h.remove();
  hist.forEach(function(m){
   if(m.role==="assistant"){var bx=add("a",m.text);attachCopy(bx,(function(t){return function(){return t}})(m.text))}
   else add("u",m.text);
  });
 }
})();
</script>
</body>
</html>
