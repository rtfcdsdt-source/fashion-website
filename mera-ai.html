<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mera AI</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f1d1a;--muted:#6b665e;--accent:#d9622b;--border:#e6e0d6;--me:#f3e6dc;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--text:#f1ede6;--muted:#a39d92;--accent:#f0804a;--border:#38332d;--me:#3a2d25;--on-accent:#1a120c}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--text:#f1ede6;--muted:#a39d92;--accent:#f0804a;--border:#38332d;--me:#3a2d25;--on-accent:#1a120c}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;background:var(--card)}
header span{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:8px}
#log{flex:1;overflow-y:auto;padding:16px;max-width:720px;width:100%;margin:0 auto}
.m{padding:10px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word;max-width:88%}
.u{background:var(--me);margin-left:auto}
.a{background:var(--card);border:1px solid var(--border)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--card);max-width:720px;width:100%;margin:0 auto}
textarea{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);resize:none;height:46px}
button{font:inherit;border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#hint{color:var(--muted);text-align:center;margin-top:40px}
</style>
</head>
<body>
<header>✨ Mera AI<span>Kuch bhi poocho</span></header>
<div id="log"><div id="hint">Namaste! Apna sawal neeche likho. Hindi, Hinglish ya English, jo bhi chalega.</div></div>
<form id="f"><textarea id="q" placeholder="Yahan likho..."></textarea><button id="b">Bhejo</button></form>
<script>
var log=document.getElementById("log"),q=document.getElementById("q"),b=document.getElementById("b"),hist=[];
function add(cls,txt){var d=document.createElement("div");d.className="m "+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
 var t=q.value.trim();if(!t)return;
 var h=document.getElementById("hint");if(h)h.remove();
 q.value="";add("u",t);hist.push({role:"user",text:t});
 var box=add("a","Soch raha hun...");b.disabled=true;q.disabled=true;
 try{
  var r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist.slice(-12)})});
  var d={};try{d=await r.json()}catch(e){}
  if(!r.ok){box.textContent=d.error||("Kuch gadbad hui (code "+r.status+"). Thodi der baad dobara try karo.");b.disabled=false;q.disabled=false;q.focus();return}
  var ans=(d.reply||"").trim();
  if(!ans){box.textContent="Khali jawab aaya. Dobara try karo.";b.disabled=false;q.disabled=false;q.focus();return}
  box.textContent=ans;hist.push({role:"assistant",text:ans});
 }catch(e){box.textContent="Internet ya server se jod nahi paya. Dobara try karo."}
 b.disabled=false;q.disabled=false;q.focus();
}
document.getElementById("f").onsubmit=function(e){e.preventDefault();send()};
q.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
</script>
</body>
</html>
